name: iOS Build CI

# 在 macOS runner 上验证 iOS：编译 Rust 核心 → 静态库 → cinterop → Framework 链接。
# 只保留手动触发：macOS 分钟按 10 倍计费，没必要挂在每个 PR 上。
on:
  workflow_dispatch:
    inputs:
      build_core:
        description: 'Build the VRCX-0 core static library and link it through cinterop'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 is the current supported image. macos-13 was removed (support ended 2025-12-04) and every
    # macOS 14 image was retired from GitHub Actions on 2026-11-02, so jobs sent to either of those sat in
    # the queue forever instead of failing.
    runs-on: macos-15

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The core is a separate repository: it is the VRCX-0 fork the phone embeds.
      - name: Checkout core
        if: ${{ inputs.build_core }}
        uses: actions/checkout@v6
        with:
          repository: 1zyao/vrcx-mobile-core
          ref: mobile
          path: core

      - name: Build core for iOS (static library)
        if: ${{ inputs.build_core }}
        working-directory: core
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios -p vrcx-0-mobile-core --lib
          ls -lh target/aarch64-apple-ios/release/libvrcx_0_mobile_core.a

      # The cinterop block in composeApp/build.gradle.kts registers itself only when this file exists,
      # so this copy is what turns the Kotlin side from a stub into a real binding.
      - name: Hand the static library to cinterop
        if: ${{ inputs.build_core }}
        run: |
          cp core/target/aarch64-apple-ios/release/libvrcx_0_mobile_core.a \
             composeApp/src/nativeInterop/cinterop/vrcx_core.a
          ls -lh composeApp/src/nativeInterop/cinterop/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the iOS Release framework (with the core assertion)
        # One link, not two. The debug framework used to be linked here purely as the stub guard, which cost
        # 27 minutes on a 3 vCPU / 7 GB runner - and then the archive linked Release anyway. The same guard
        # runs against the Release log below.
        run: |
          # `pipefail` matters: without it the exit status of the pipeline is tee's, so a failed Kotlin
          # compile would sail through as a green step. That is exactly what happened once already.
          set -o pipefail
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --console=plain \
            --stacktrace --max-workers=1 2>&1 | tee /tmp/ios-build.log
          # The build prints which VrcxCoreBridge it compiled. Assert it, because a skipped cinterop still
          # produces a linking framework - against the stub - and would otherwise look like success.
          grep -q "VRCX core for iOS: iosCore (static library present)" /tmp/ios-build.log \
            || { echo "::error::the core was not compiled into iOS (stub variant selected)"; grep "VRCX core for iOS" /tmp/ios-build.log || true; exit 1; }

      - name: Confirm cinterop was wired
        if: ${{ inputs.build_core }}
        # If the guard silently skipped cinterop the framework still links - but against the stub. This
        # step is the difference between "iOS builds" and "iOS builds with the core".
        run: |
          test -f composeApp/src/nativeInterop/cinterop/vrcx_core.a
          echo "core archive: $(stat -f%z composeApp/src/nativeInterop/cinterop/vrcx_core.a) bytes"
          ls composeApp/build/classes/kotlin/iosArm64/main/cinterop 2>/dev/null || true

      - name: List iOS Framework files (for debugging)
        run: find . -path "*ComposeApp.framework" -type d

      # Everything below is the unsigned-device-IPA path, and it only makes sense when the core was
      # compiled in: without it the app would install and then fail to reach a core that is not there.
      #
      # The recipe is the one `release.yml` already uses for release IPAs, minus signing: archive with
      # `CODE_SIGNING_ALLOWED=NO`, then let `iosApp/package-ipa.sh` ad-hoc sign and zip the Payload.
      # Ad-hoc is enough for SideStore / AltStore to re-sign on the device.
      - name: Archive and package an unsigned device IPA
        if: ${{ inputs.build_core }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VRCM.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            VRCM_DISTRIBUTION_CHANNEL=GitHub archive
          bash iosApp/package-ipa.sh "$RUNNER_TEMP/VRCM.xcarchive" "$GITHUB_WORKSPACE/artifacts/VRCM-unsigned.ipa"
          ls -lh artifacts/*.ipa

      - name: Upload the unsigned IPA
        if: ${{ inputs.build_core }}
        # Before the verification step on purpose: the IPA is the deliverable, and an over-strict assertion
        # should not throw it away. The check below still fails the job when the core is missing.
        uses: actions/upload-artifact@v7
        with:
          name: VRCM-ios-unsigned
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Verify the IPA really carries the core
        if: ${{ inputs.build_core }}
        # An IPA that installs but has no core is the failure mode worth catching here: the app would come up,
        # try to start `vrcx_core_start`, and show an empty shell with no diagnostics.
        run: |
          set -euo pipefail
          # The bundle is not `iosApp.app`: `Config.xcconfig` sets APP_NAME=VRCM, so PRODUCT_NAME follows it.
          # Globbing also survives that being renamed again.
          APP=$(find "$RUNNER_TEMP/VRCM.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$APP" ] || { echo "::error::no app bundle in the archive"; find "$RUNNER_TEMP/VRCM.xcarchive" -maxdepth 3; exit 1; }
          echo "app bundle: $APP"
          test -d "$APP/Frameworks/ComposeApp.framework" \
            || { echo "::error::ComposeApp.framework was not embedded"; find "$APP" -maxdepth 2; exit 1; }
          lipo -info "$APP/Frameworks/ComposeApp.framework/ComposeApp"
          echo "framework size: $(stat -f%z "$APP/Frameworks/ComposeApp.framework/ComposeApp") bytes"
          # The C entry point is exported by the core and called by the Kotlin bridge, so it must be in the
          # linked binary. `nm` first (exact), `strings` as the fallback for stripped builds.
          if nm -gj "$APP/Frameworks/ComposeApp.framework/ComposeApp" 2>/dev/null | grep -q vrcx_core_start; then
            echo "core symbol found via nm"
          elif strings -a "$APP/Frameworks/ComposeApp.framework/ComposeApp" | grep -q vrcx_core_start; then
            echo "core symbol found via strings"
          else
            echo "::error::vrcx_core_start is not in the framework - this IPA has no core"
            exit 1
          fi
          # Loopback HTTP must stay allowed, or the app cannot reach its own in-process core.
          plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$APP/Info.plist"
          echo "IPA: $(ls -lh "$GITHUB_WORKSPACE"/artifacts/*.ipa)"
